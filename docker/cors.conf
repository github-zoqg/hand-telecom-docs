# /etc/nginx/conf.d/cors.conf
map $http_origin $allow_origin {
    default "";
    ~^https?://([a-z0-9-]+\.)?handteledev\.com$ $http_origin;
}

server {
    listen 80;
    server_name handteledev.com *.handteledev.com;

    # CORS 配置
    add_header 'Access-Control-Allow-Origin' $allow_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,X-Requested-With' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age' 1728000 always;


    gzip on;
    gzip_min_length 10k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types text/css text/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 处理预检请求
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # location = /xcerp-poc/ {
    #     # 内部重定向到根目录的 index.html
    #     try_files /index.html =404;
    # }

    # 应用配置
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; 
    }
}
