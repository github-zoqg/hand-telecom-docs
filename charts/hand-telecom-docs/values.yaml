# Default values for api-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

## 设置默认的 image、imageTag 和 imagePullPolicy。
image:
  repository: registry.choerodon.com.cn/cmcc-htcp/hand-telecom-docs
  # tag: ~
  pullPolicy: IfNotPresent

## Deployment 更新策略
deploymentUpdate:
  type: RollingUpdate
  maxUnavailable: 0
  maxSurge: 100%

## Pod 优先级设置
## ref: https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/
##
priorityClassName: ""

## Pod 节点分配
## ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}
tolerations: []
affinity: {}

## 给 Pod 附加的 annotations
podAnnotations: {}

## ## Pod 附加的 labels
podLabels: {}

# preJob:
#   preConfig:
#     mysql:
#       host: localhost
#       port: 3306
#       username: choerodon
#       password: 123456
#       dbname: iam_service

## service 相关设置
## ref: http://kubernetes.io/docs/user-guide/services/
##
service:
  # 是否启用 service 暴露本服务
  enabled: false
  # Service 名称
  name: umi-plugin-hzero-layout
  # Service 类型
  type: ClusterIP
  # 指定 service 的 clusterIP
  clusterIP: ~
  # 端口设置
  ports:
    # 服务端口
    http:
      port: 80
  ## externalIPs 设置
  # externalIPs:
  #   - externalIp1
  annotations: {}

# 是否收集日志至EFK
logs:
  enabled: false
  # 日志收集格式
  parser: nginx

## Ingress 相关配置
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  enabled: false
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # nginx.ingress.kubernetes.io/whitelist-source-range: 0.0.0.0/0
  path: /
  host: choerodon.example.com
  tls: []
  # - secretName: choerodon-example-tls
  #   hosts:
  #   - choerodon.example.com

env:
  open:
    # BUILD_BASE_PATH: /
    BUILD_PUBLIC_URL: /
    BUILD_CLIENT_ID: localhost
    BUILD_WEBSOCKET_HOST: http://gateway.example.com/hpfm/sock-js
    BUILD_API_HOST: http://gateway.example.com
    BUILD_PLATFORM_VERSION: SASS
    BUILD_PACKAGE_PUBLIC_URL: ""
    S_NAMESPACE: hzero_front_dev # 配置微前端组命名空间的名称， 同一个命名空间下部署的应用会相互通信，自动注册
    USE_REDIS: none
    # USE_REDIS: true
    # S_REDIS_HOST: redis-service
    # S_REDIS_PORT: 6379
    # BUILD_BPM_HOST: http://bpm.hzero-backend.open-front.hand-china.com
    # IM_ENABLE: BUILD_IM_ENABLE # // im是否启用，true/false
    # IM_WEBSOCKET_HOST: BUILD_IM_WEBSOCKET_HOST # // im websocket 地址
    # TRACE_LOG_ENABLE: BUILD_TRACE_LOG_ENABLE # // TraceLog日志追溯分析是否启用，true/false
    # CUSTOMIZE_ICON_NAME: BUILD_CUSTOMIZE_ICON_NAME # // 客制化的iconfont font family 名称

## 资源请求和限制相关配置
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
##
resources:
  limits:
    # cpu: 100m
    memory: 128Mi
  requests:
    # cpu: 100m
    memory: 128Mi
